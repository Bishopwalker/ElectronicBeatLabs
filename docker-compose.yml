services:
  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ebl-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:

      # Application
      PYTHON_ENV: ${PYTHON_ENV:-production}

      # Security (Optional - only needed for timer API and subscription features)
      # Core audio/WebSocket functionality works without these
      # Required when enabling: /api/timer/* or /api/subscription/*
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}

      # CORS - FIXED to allow proper origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,/.*}
      
      # WebSocket Configuration
      WS_HEARTBEAT_INTERVAL: 30
      WS_CONNECTION_TIMEOUT: 60
      
      # Audio Engine
      SAMPLE_RATE: ${SAMPLE_RATE:-48000}
      BUFFER_SIZE: ${BUFFER_SIZE:-800}  # 800 samples per frame at 48kHz/60fps
      MAX_FREQUENCY: ${MAX_FREQUENCY:-199}
      AUDIO_FRAME_RATE: 60

    volumes:
      # Mount backend source files only (exclude .venv)
      - ./backend/main.py:/app/main.py
      - ./backend/core:/app/core
      - ./backend/api:/app/api
      - ./backend/schemas:/app/schemas
      - ./backend/utils:/app/utils
      - ./backend/requirements.txt:/app/requirements.txt

      # Persist data
      - ./logs:/app/logs
      - ./data:/app/data
      - ./uploads:/app/uploads

    networks:
      - ebl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5173}
    container_name: ebl-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # Frontend Nginx production server
    depends_on:
      - backend
    networks:
      - ebl-network
    environment:
      PYTHON_ENV: development
      DEBUG: "true"

      # Runtime nginx environment
      BACKEND_URL: http://backend:8000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  node_modules_volume:
    driver: local
  python_venv_volume:
    driver: local

networks:
  ebl-network:
    driver: bridge