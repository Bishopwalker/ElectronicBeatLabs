[tool:pytest]
asyncio_default_fixture_loop_scope = function
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning
    ignore::PytestDeprecationWarning