# Prometheus configuration for EBL monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "ebl_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # EBL Application metrics
  - job_name: 'ebl-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']  # Adjust for your setup
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 10s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']