# Electromagnetic Beat Lab - Serverless Framework Configuration
# Deploy to AWS Lambda + API Gateway + S3

service: electromagnetic-beat-lab

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  memorySize: 512
  timeout: 30
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-*"

functions:
  # WebSocket Connection Management
  websocketConnect:
    handler: backend/lambda_handlers.websocket_connect
    events:
      - websocket:
          route: $connect
          
  websocketDisconnect:
    handler: backend/lambda_handlers.websocket_disconnect
    events:
      - websocket:
          route: $disconnect
          
  websocketDefault:
    handler: backend/lambda_handlers.websocket_default
    events:
      - websocket:
          route: $default

  # Audio Engine API
  audioEngine:
    handler: backend/lambda_handlers.audio_handler
    events:
      - http:
          path: /audio/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /audio
          method: ANY
          cors: true

  # Health Check
  health:
    handler: backend/lambda_handlers.health_check
    events:
      - http:
          path: /health
          method: get
          cors: true

  # Authentication
  auth:
    handler: backend/lambda_handlers.auth_handler
    events:
      - http:
          path: /auth/{proxy+}
          method: ANY
          cors: true

resources:
  Resources:
    # DynamoDB Tables
    AudioSessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-sessions
        AttributeDefinitions:
          - AttributeName: session_id
            AttributeType: S
        KeySchema:
          - AttributeName: session_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-connections
        AttributeDefinitions:
          - AttributeName: connection_id
            AttributeType: S
        KeySchema:
          - AttributeName: connection_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # S3 Bucket for Frontend
    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-frontend
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: error.html

    # CloudFront Distribution
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: !GetAtt FrontendBucket.RegionalDomainName
              Id: S3Origin
              S3OriginConfig:
                OriginAccessIdentity: ""
          Enabled: true
          DefaultRootObject: index.html
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed caching optimized
          PriceClass: PriceClass_100
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

  Outputs:
    WebsocketURI:
      Description: "WebSocket URI"
      Value: 
        Fn::Join:
          - ""
          - - "wss://"
            - Ref: WebsocketsApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
    
    ApiEndpoint:
      Description: "API Gateway endpoint URL"
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: RestApiApigwRestApi
            - ".execute-api."
            - ${self:provider.region}
            - ".amazonaws.com/"
            - ${self:provider.stage}
    
    FrontendURL:
      Description: "Frontend CloudFront URL"
      Value: !GetAtt CloudFrontDistribution.DomainName

plugins:
  - serverless-python-requirements
  - serverless-wsgi

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    strip: false
  wsgi:
    app: backend.main.app
    packRequirements: false

package:
  patterns:
    - '!node_modules/**'
    - '!dist/**'
    - '!coverage/**'
    - '!reports/**'
    - '!*.md'
    - '!.git/**'
    - 'backend/**'
    - '!backend/venv/**'
    - '!backend/__pycache__/**'
    - '!backend/**/__pycache__/**'
    - '!backend/**/*.pyc'