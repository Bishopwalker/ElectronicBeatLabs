# Deployment Pipeline Extension for GitLab CI
# Include this in your main .gitlab-ci.yml: include: '.gitlab-ci-deploy.yml'

# ==========================================
# DEPLOYMENT STAGES
# ==========================================

deploy:frontend:staging:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  needs: 
    - job: package:docker
      artifacts: false
    - job: quality_gate
      artifacts: false
  before_script:
    # Install Node.js for build
    - yum install -y nodejs npm
    # Configure AWS credentials from GitLab CI/CD variables
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION
  script:
    # Build frontend
    - npm ci
    - npm run build
    # Deploy to S3
    - |
      S3_BUCKET="ebl-frontend-staging-${AWS_ACCOUNT_ID}"
      aws s3 sync dist/ "s3://${S3_BUCKET}/" \
        --delete \
        --cache-control "public, max-age=3600"
    # Invalidate CloudFront
    - |
      DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
        --stack-name "ebl-frontend-staging" \
        --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
        --output text)
      aws cloudfront create-invalidation \
        --distribution-id "$DISTRIBUTION_ID" \
        --paths "/*"
  environment:
    name: staging
    url: https://staging.ebl.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - when: manual

deploy:backend:staging:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  needs:
    - job: package:docker
      artifacts: false
    - job: quality_gate
      artifacts: false
  before_script:
    # Install AWS CLI
    - apk add --no-cache aws-cli
    # Configure AWS
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION
    # Login to ECR
    - |
      aws ecr get-login-password | \
      docker login --username AWS --password-stdin \
      "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  script:
    # Build and push Docker image
    - |
      ECR_REPOSITORY="ebl-backend-staging"
      ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
      docker build -t "$ECR_URI" -f backend/Dockerfile .
      docker push "$ECR_URI"
    # Update ECS service
    - |
      CLUSTER_NAME=$(aws cloudformation describe-stacks \
        --stack-name "ebl-backend-staging" \
        --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
        --output text)
      SERVICE_NAME=$(aws cloudformation describe-stacks \
        --stack-name "ebl-backend-staging" \
        --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" \
        --output text)
      aws ecs update-service \
        --cluster "$CLUSTER_NAME" \
        --service "$SERVICE_NAME" \
        --force-new-deployment
  environment:
    name: staging
    url: https://api-staging.ebl.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - when: manual

deploy:frontend:production:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  needs:
    - job: package:docker
      artifacts: false
    - job: quality_gate
      artifacts: false
  before_script:
    - yum install -y nodejs npm
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION
  script:
    # Build frontend with production config
    - npm ci
    - npm run build
    # Deploy to S3
    - |
      S3_BUCKET="ebl-frontend-production-${AWS_ACCOUNT_ID}"
      aws s3 sync dist/ "s3://${S3_BUCKET}/" \
        --delete \
        --cache-control "public, max-age=31536000" \
        --exclude "*.html" \
        --exclude "service-worker.js"
      # HTML files with no-cache
      aws s3 sync dist/ "s3://${S3_BUCKET}/" \
        --exclude "*" \
        --include "*.html" \
        --include "service-worker.js" \
        --cache-control "no-cache, no-store, must-revalidate"
    # Invalidate CloudFront
    - |
      DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
        --stack-name "ebl-frontend-production" \
        --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
        --output text)
      aws cloudfront create-invalidation \
        --distribution-id "$DISTRIBUTION_ID" \
        --paths "/*"
  environment:
    name: production
    url: https://ebl.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_TAG

deploy:backend:production:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  needs:
    - job: package:docker
      artifacts: false
    - job: quality_gate
      artifacts: false
  before_script:
    - apk add --no-cache aws-cli
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION
    - |
      aws ecr get-login-password | \
      docker login --username AWS --password-stdin \
      "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  script:
    # Build and push Docker image
    - |
      ECR_REPOSITORY="ebl-backend-production"
      ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
      docker build -t "$ECR_URI" -f backend/Dockerfile .
      docker push "$ECR_URI"
      # Also tag as latest
      docker tag "$ECR_URI" "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest"
      docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest"
    # Update ECS service
    - |
      CLUSTER_NAME=$(aws cloudformation describe-stacks \
        --stack-name "ebl-backend-production" \
        --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
        --output text)
      SERVICE_NAME=$(aws cloudformation describe-stacks \
        --stack-name "ebl-backend-production" \
        --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" \
        --output text)
      # Update task definition with new image
      TASK_DEFINITION=$(aws ecs describe-services \
        --cluster "$CLUSTER_NAME" \
        --services "$SERVICE_NAME" \
        --query "services[0].taskDefinition" \
        --output text)
      NEW_TASK_DEF=$(aws ecs describe-task-definition \
        --task-definition "$TASK_DEFINITION" \
        --query "taskDefinition" | \
        jq --arg IMAGE "$ECR_URI" '.containerDefinitions[0].image = $IMAGE' | \
        jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
      NEW_TASK_ARN=$(aws ecs register-task-definition \
        --cli-input-json "$NEW_TASK_DEF" \
        --query "taskDefinition.taskDefinitionArn" \
        --output text)
      # Update service with new task definition
      aws ecs update-service \
        --cluster "$CLUSTER_NAME" \
        --service "$SERVICE_NAME" \
        --task-definition "$NEW_TASK_ARN"
  environment:
    name: production
    url: https://api.ebl.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_TAG

# ==========================================
# ROLLBACK JOBS
# ==========================================

rollback:frontend:production:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION
  script:
    - echo "Rolling back frontend to previous version..."
    # Implementation depends on versioning strategy
    # Could use S3 versioning or previous build artifacts
  environment:
    name: production
    action: rollback
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

rollback:backend:production:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION
  script:
    - echo "Rolling back backend to previous version..."
    - |
      CLUSTER_NAME=$(aws cloudformation describe-stacks \
        --stack-name "ebl-backend-production" \
        --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
        --output text)
      SERVICE_NAME=$(aws cloudformation describe-stacks \
        --stack-name "ebl-backend-production" \
        --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" \
        --output text)
      # Get previous task definition
      CURRENT_TASK_DEF=$(aws ecs describe-services \
        --cluster "$CLUSTER_NAME" \
        --services "$SERVICE_NAME" \
        --query "services[0].taskDefinition" \
        --output text)
      TASK_FAMILY=$(echo "$CURRENT_TASK_DEF" | cut -d: -f1 | cut -d/ -f2)
      CURRENT_REVISION=$(echo "$CURRENT_TASK_DEF" | cut -d: -f2)
      PREVIOUS_REVISION=$((CURRENT_REVISION - 1))
      # Roll back to previous revision
      aws ecs update-service \
        --cluster "$CLUSTER_NAME" \
        --service "$SERVICE_NAME" \
        --task-definition "${TASK_FAMILY}:${PREVIOUS_REVISION}"
  environment:
    name: production
    action: rollback
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"