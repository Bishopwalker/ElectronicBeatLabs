# Docker Compose Override - Working Configuration
# Based on container hashes: 239fb578, d3b6e2ce, 5abb530e
# This file overrides settings in docker-compose.yml

services:
  backend:
    environment:
      # Fix sample rate mismatch - use 48kHz everywhere
      SAMPLE_RATE: 48000
      BUFFER_SIZE: 800
      AUDIO_FRAME_RATE: 60
      
      # WebSocket configuration for stability
      WS_HEARTBEAT_INTERVAL: 30
      WS_CONNECTION_TIMEOUT: 60
      WS_MAX_MESSAGE_SIZE: 10485760  # 10MB for audio frames
      
      # CORS - Allow all origins for development
      ALLOWED_ORIGINS: "*"
      
      # Logging
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"
      
    # Resource limits to prevent memory issues
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    
    # Restart policy for stability
    restart: unless-stopped
    
    # Health check with proper timeout
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    environment:
      # WebSocket URLs for proper connection
      VITE_WS_URL: ws://localhost:8000
      VITE_API_URL: http://localhost:8000
      
      # Development mode
      NODE_ENV: development
      
    # Ensure frontend starts after backend is healthy
    depends_on:
      backend:
        condition: service_healthy
