name: AWS Serverless Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Build Frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # Test Backend
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest --ignore=manual_route_test.py || true
      
      - name: Validate Python syntax
        run: |
          cd backend
          python -m py_compile main.py
          python -m py_compile lambda_handlers.py

  # Deploy to AWS (only on main branch)
  deploy-aws:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install Serverless Framework
        run: |
          npm install -g serverless
          serverless plugin install -n serverless-python-requirements
          serverless plugin install -n serverless-wsgi
      
      - name: Install system dependencies for Lambda
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
      
      - name: Deploy backend with Serverless
        run: |
          serverless deploy --stage prod --verbose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Get deployment outputs
        id: outputs
        run: |
          FRONTEND_BUCKET=$(serverless info --stage prod | grep "FrontendBucket:" | cut -d' ' -f2)
          CLOUDFRONT_URL=$(serverless info --stage prod | grep "FrontendURL:" | cut -d' ' -f2)
          API_URL=$(serverless info --stage prod | grep "ApiEndpoint:" | cut -d' ' -f2)
          WEBSOCKET_URL=$(serverless info --stage prod | grep "WebsocketURI:" | cut -d' ' -f2)
          
          echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "websocket_url=$WEBSOCKET_URL" >> $GITHUB_OUTPUT
      
      - name: Deploy frontend to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.outputs.outputs.frontend_bucket }}/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ steps.outputs.outputs.cloudfront_url }} --paths "/*" || true
      
      - name: Update frontend config with API endpoints
        run: |
          cat > dist/config.js << EOF
          window.EBL_CONFIG = {
            API_URL: '${{ steps.outputs.outputs.api_url }}',
            WEBSOCKET_URL: '${{ steps.outputs.outputs.websocket_url }}',
            ENVIRONMENT: 'production'
          };
          EOF
          aws s3 cp dist/config.js s3://${{ steps.outputs.outputs.frontend_bucket }}/config.js
      
      - name: Output deployment URLs
        run: |
          echo "🚀 Deployment Complete!"
          echo "Frontend URL: https://${{ steps.outputs.outputs.cloudfront_url }}"
          echo "API URL: ${{ steps.outputs.outputs.api_url }}"
          echo "WebSocket URL: ${{ steps.outputs.outputs.websocket_url }}"

  # Deploy to staging (for develop branch)
  deploy-staging:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install Serverless Framework
        run: |
          npm install -g serverless
          serverless plugin install -n serverless-python-requirements
          serverless plugin install -n serverless-wsgi
      
      - name: Deploy to staging
        run: |
          serverless deploy --stage staging --verbose
      
      - name: Deploy frontend to staging S3
        run: |
          FRONTEND_BUCKET=$(serverless info --stage staging | grep "FrontendBucket:" | cut -d' ' -f2)
          aws s3 sync dist/ s3://$FRONTEND_BUCKET/ --delete
          echo "Staging deployed to S3 bucket: $FRONTEND_BUCKET"