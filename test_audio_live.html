<!DOCTYPE html>
<html>
<head>
    <title>Live Audio Test - Electromagnetic Beat Lab</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #000; 
            color: #fff; 
            padding: 20px;
        }
        button { 
            padding: 10px 20px; 
            margin: 10px; 
            background: #ff6b00; 
            color: white; 
            border: none; 
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled { 
            background: #666; 
            cursor: not-allowed;
        }
        .status { 
            margin: 10px 0; 
            padding: 10px; 
            background: #333; 
            border-radius: 5px;
        }
        .error { background: #800; }
        .success { background: #080; }
    </style>
</head>
<body>
    <h1>🎵 Live Audio Engine Test</h1>
    <p>This will test if the core audio functionality works in the browser</p>
    
    <button id="startBtn" onclick="startBinauralBeat()">Start 4Hz Binaural Beat (440Hz/444Hz)</button>
    <button id="stopBtn" onclick="stopBinauralBeat()" disabled>Stop Audio</button>
    
    <div id="status" class="status">Ready to test...</div>
    
    <h2>Test Results:</h2>
    <ul id="results"></ul>

    <script>
        let audioContext = null;
        let oscillatorLeft = null;
        let oscillatorRight = null;
        let gainLeft = null;
        let gainRight = null;
        let pannerLeft = null;
        let pannerRight = null;
        
        function log(message, isError = false, isSuccess = false) {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            status.textContent = message;
            status.className = isError ? 'status error' : (isSuccess ? 'status success' : 'status');
            
            const li = document.createElement('li');
            li.textContent = new Date().toLocaleTimeString() + ': ' + message;
            li.style.color = isError ? '#ff6666' : (isSuccess ? '#66ff66' : '#ffffff');
            results.appendChild(li);
            
            console.log(message);
        }
        
        async function startBinauralBeat() {
            try {
                log('🎵 Initializing Web Audio API...');
                
                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log('✅ Audio context created: ' + audioContext.state);
                
                // Resume if suspended
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                    log('✅ Audio context resumed');
                }
                
                // Create oscillators
                oscillatorLeft = audioContext.createOscillator();
                oscillatorRight = audioContext.createOscillator();
                log('✅ Oscillators created');
                
                // Create gain nodes
                gainLeft = audioContext.createGain();
                gainRight = audioContext.createGain();
                log('✅ Gain nodes created');
                
                // Create stereo panners
                pannerLeft = audioContext.createStereoPanner();
                pannerRight = audioContext.createStereoPanner();
                log('✅ Stereo panners created');
                
                // Configure oscillators
                oscillatorLeft.frequency.setValueAtTime(440, audioContext.currentTime);  // Left ear: 440Hz
                oscillatorRight.frequency.setValueAtTime(444, audioContext.currentTime); // Right ear: 444Hz
                oscillatorLeft.type = 'sine';
                oscillatorRight.type = 'sine';
                log('✅ Frequencies set: 440Hz (left) / 444Hz (right) = 4Hz binaural beat');
                
                // Configure gain (volume)
                gainLeft.gain.setValueAtTime(0.1, audioContext.currentTime);  // Low volume
                gainRight.gain.setValueAtTime(0.1, audioContext.currentTime);
                log('✅ Volume set to 10% for safety');
                
                // Configure panners
                pannerLeft.pan.setValueAtTime(-1, audioContext.currentTime);  // Full left
                pannerRight.pan.setValueAtTime(1, audioContext.currentTime);  // Full right
                log('✅ Stereo panning configured');
                
                // Connect audio graph
                oscillatorLeft.connect(gainLeft).connect(pannerLeft).connect(audioContext.destination);
                oscillatorRight.connect(gainRight).connect(pannerRight).connect(audioContext.destination);
                log('✅ Audio graph connected');
                
                // Start oscillators
                oscillatorLeft.start();
                oscillatorRight.start();
                
                log('🎵 BINAURAL BEAT STARTED! You should hear a 4Hz beating effect.', false, true);
                log('   Put on headphones for best results. Left ear = 440Hz, Right ear = 444Hz');
                
                // Update UI
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                
            } catch (error) {
                log('❌ ERROR: ' + error.message, true);
                console.error('Full error:', error);
            }
        }
        
        function stopBinauralBeat() {
            try {
                log('⏹️ Stopping audio...');
                
                if (oscillatorLeft) {
                    oscillatorLeft.stop();
                    oscillatorLeft.disconnect();
                    oscillatorLeft = null;
                }
                
                if (oscillatorRight) {
                    oscillatorRight.stop();
                    oscillatorRight.disconnect();
                    oscillatorRight = null;
                }
                
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }
                
                log('✅ Audio stopped successfully', false, true);
                
                // Update UI
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                
            } catch (error) {
                log('❌ ERROR stopping audio: ' + error.message, true);
            }
        }
        
        // Test on page load
        window.addEventListener('load', () => {
            log('🚀 Audio test page loaded. Click "Start" to test binaural beats.');
            
            // Check Web Audio API support
            if (!window.AudioContext && !window.webkitAudioContext) {
                log('❌ Web Audio API not supported in this browser', true);
            } else {
                log('✅ Web Audio API supported');
            }
        });
        
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            stopBinauralBeat();
        });
    </script>
</body>
</html>
