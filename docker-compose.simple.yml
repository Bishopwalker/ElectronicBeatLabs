version: '3.8'

services:
  # Simplified Development Application (No DB dependencies)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ebl-app-dev
    restart: unless-stopped
    ports:
      - "5173:5173"  # Frontend Vite
      - "8000:8000"  # Backend FastAPI
    environment:
      # Development
      NODE_ENV: development
      PYTHON_ENV: development
      DEBUG: "true"

      # Security (dev keys)
      SECRET_KEY: dev-secret-key-not-for-production
      JWT_SECRET: dev-jwt-secret-not-for-production

      # CORS (allow all in dev)
      ALLOWED_ORIGINS: "*"
    volumes:
      # Mount source for hot-reload
      - ./src:/app/src
      - ./backend:/app/backend
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json

      # Persist data
      - ./logs:/app/logs
      - ./data:/app/data

      # Exclude node_modules
      - /app/node_modules
    networks:
      - ebl-dev-network

networks:
  ebl-dev-network:
    driver: bridge