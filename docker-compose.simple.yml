services:
  # Simplified Development Application (No DB dependencies)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ebl-app-dev
    restart: unless-stopped
    ports:
      - "5173:5173"  # Frontend Vite
      - "8000:8000"  # Backend FastAPI
    environment:
      # Development
      NODE_ENV: development
      PYTHON_ENV: development
      DEBUG: "true"

      # Security (dev keys)
      SECRET_KEY: dev-secret-key-not-for-production
      JWT_SECRET: dev-jwt-secret-not-for-production

      # CORS (allow all in dev)
      ALLOWED_ORIGINS: "*"
    volumes:
      # Mount source for hot-reload
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json

      # Mount backend source files only (exclude .venv)
      - ./backend/main.py:/app/backend/main.py
      - ./backend/core:/app/backend/core
      - ./backend/api:/app/backend/api
      - ./backend/schemas:/app/backend/schemas
      - ./backend/utils:/app/backend/utils
      - ./backend/requirements.txt:/app/backend/requirements.txt

      # Persist data
      - ./logs:/app/logs
      - ./data:/app/data

      # Use named volumes for node_modules and Python venv (prevent host conflicts)
      - node_modules_volume:/app/node_modules
      - python_venv_volume:/app/backend/.venv
    networks:
      - ebl-dev-network

volumes:
  node_modules_volume:
    driver: local
  python_venv_volume:
    driver: local

networks:
  ebl-dev-network:
    driver: bridge