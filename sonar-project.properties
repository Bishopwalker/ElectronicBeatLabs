# SonarQube Configuration for Electromagnetic Beat Lab
# Security-focused analysis with comprehensive coverage

# Project identification
sonar.projectKey=electromagnetic-beat-lab
sonar.projectName=Electromagnetic Beat Lab
sonar.projectVersion=1.0.0
sonar.organization=bishop8-group

# Source code configuration
sonar.sources=src,backend
sonar.tests=src,backend,features
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.py
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**,**/build/**,**/*.d.ts

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

# Language-specific settings
sonar.typescript.node=node_modules/@types/node
sonar.javascript.environments=browser,node,jest
sonar.python.version=3.11

# Security-focused rules
sonar.qualitygate.wait=true
sonar.security.hotspots.inheritFromParent=false

# Code quality thresholds (Security-focused)
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/test/**,**/tests/**,**/__tests__/**,**/mocks/**
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*

# Security hotspot rules
sonar.security.review.categories=sql-injection,command-injection,path-injection,ldap-injection,xpath-injection,expression-lang-injection,log-injection,xxe,xss,dos,ssrf,csrf,http-response-splitting,open-redirect,weak-cryptography,auth,insecure-conf,file-manipulation,cookie-security,traceability,permission,others

# Custom security rules for Web Audio API and Electromagnetic applications  
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Ignore false positives for Web Audio API usage
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/useAudioEngine.ts

# Allow binaural audio frequency calculations  
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S109
sonar.issue.ignore.multicriteria.e2.resourceKey=**/patterns.ts

# Allow electromagnetic field calculations
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e3.resourceKey=**/ElectromagneticBeatLab.tsx

# Allow WebSocket connections for real-time audio
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S5122
sonar.issue.ignore.multicriteria.e4.resourceKey=**/useWebSocket.ts

# Allow localStorage for audio preferences (legitimate use)
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S3516
sonar.issue.ignore.multicriteria.e5.resourceKey=**/AudioSettingsContext.tsx

# Performance monitoring
sonar.newCode.period=previous_version