services:
  # Backend FastAPI service
  - type: web
    name: ebl-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend.render
    dockerContext: .
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ebl-frontend.onrender.com
      - key: SAMPLE_RATE
        value: 48000
      - key: BUFFER_SIZE
        value: 800
      - key: MAX_FREQUENCY
        value: 199
      - key: AUDIO_FRAME_RATE
        value: 60
      - key: WS_HEARTBEAT_INTERVAL
        value: 30
      - key: WS_CONNECTION_TIMEOUT
        value: 60
    healthCheckPath: /health
    autoDeploy: true

  # Frontend React service
  - type: web
    name: ebl-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend.render
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        value: https://ebl-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://ebl-backend.onrender.com
      - key: PYTHON_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
