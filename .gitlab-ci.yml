# Electromagnetic Beat Lab - Optimized CI/CD Pipeline
# Fixed for common issues: PyAudio, security tools, test coverage

stages:
  - prepare
  - test
  - security
  - build
  - deploy

variables:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  DOCKER_DRIVER: overlay2
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/npm
    - node_modules/
    - backend/.venv/

# ============================================
# PREPARE STAGE
# ============================================

install-dependencies:
  stage: prepare
  image: node:$NODE_VERSION
  script:
    - npm ci --cache $NPM_CACHE_DIR
    - npm run build
  artifacts:
    paths:
      - node_modules/
      - dist/
    expire_in: 1 day

install-backend:
  stage: prepare
  image: python:$PYTHON_VERSION
  before_script:
    # Install system dependencies for Python packages (NOT PyAudio)
    - apt-get update && apt-get install -y
        gcc
        g++
        make
        libffi-dev
        libssl-dev
  script:
    - cd backend
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    # Use CI requirements without PyAudio
    - |
      if [ -f "requirements-ci.txt" ]; then
        pip install -r requirements-ci.txt
      else
        # Filter out pyaudio from regular requirements
        grep -v pyaudio requirements.txt > requirements-temp.txt
        pip install -r requirements-temp.txt
      fi
    # Add PyAudio mock for testing
    - mkdir -p mocks
    - echo "import sys; sys.modules['pyaudio'] = __import__('mocks.pyaudio_mock', fromlist=[''])" > mocks/__init__.py
  artifacts:
    paths:
      - backend/.venv/
      - backend/mocks/
    expire_in: 1 day

# ============================================
# TEST STAGE
# ============================================

frontend-tests:
  stage: test
  image: node:$NODE_VERSION
  dependencies:
    - install-dependencies
  script:
    - npm run test:ci
    - npm run lint
  artifacts:
    reports:
      junit:
        - junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'

backend-tests:
  stage: test
  image: python:$PYTHON_VERSION
  dependencies:
    - install-backend
  script:
    - cd backend
    - source .venv/bin/activate
    # Mock PyAudio for tests
    - export PYTHONPATH="${PYTHONPATH}:${CI_PROJECT_DIR}/backend/mocks"
    - python -m pytest --cov=. --cov-report=xml --cov-report=term --junitxml=junit.xml
  artifacts:
    reports:
      junit:
        - backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ============================================
# SECURITY STAGE (Conditional)
# ============================================

sast:
  stage: security
  include:
    - template: Security/SAST.gitlab-ci.yml
  variables:
    SAST_EXCLUDED_PATHS: "node_modules, dist, coverage, .venv, backend/.venv"
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

dependency_scanning:
  stage: security
  include:
    - template: Security/Dependency-Scanning.gitlab-ci.yml
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

secret_detection:
  stage: security
  include:
    - template: Security/Secret-Detection.gitlab-ci.yml
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Optional: SonarQube (only if configured)
sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - |
      if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
        sonar-scanner \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.projectKey=electromagnetic-beat-lab \
          -Dsonar.sources=src,backend \
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/** \
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.python.coverage.reportPaths=backend/coverage.xml
      else
        echo "SonarQube not configured, skipping..."
      fi
  dependencies:
    - frontend-tests
    - backend-tests
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# ============================================
# BUILD STAGE
# ============================================

build-frontend:
  stage: build
  image: node:$NODE_VERSION
  dependencies:
    - install-dependencies
    - frontend-tests
  script:
    - npm run build
    - echo "Build completed successfully"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build-docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - |
      if [ -n "$CI_REGISTRY" ]; then
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
        docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      else
        echo "Docker registry not configured, skipping..."
      fi
  only:
    - main
    - develop
  allow_failure: true

# ============================================
# DEPLOY STAGE
# ============================================

deploy-vercel:
  stage: deploy
  image: node:$NODE_VERSION
  dependencies:
    - build-frontend
  script:
    - |
      if [ -n "$VERCEL_TOKEN" ]; then
        npm install -g vercel
        vercel pull --yes --token=$VERCEL_TOKEN
        vercel deploy --prebuilt --token=$VERCEL_TOKEN
      else
        echo "Vercel not configured, skipping deployment..."
      fi
  environment:
    name: preview/$CI_COMMIT_REF_NAME
    url: https://ebl-$CI_COMMIT_REF_SLUG.vercel.app
  only:
    - main
    - develop
  when: manual
  allow_failure: true

# ============================================
# QUICK FIXES FOR COMMON ISSUES
# ============================================

.fix-template:
  before_script:
    # Fix for missing dependencies
    - |
      if command -v apt-get &> /dev/null; then
        apt-get update && apt-get install -y git curl
      fi
    # Fix for git permissions
    - git config --global --add safe.directory $CI_PROJECT_DIR