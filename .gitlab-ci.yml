# Electromagnetic Beat Lab - Comprehensive Security & Quality CI/CD Pipeline
# Enhanced security monitoring with CodeQL-equivalent, Dependabot-like scanning, and SonarQube

stages:
  - security-scan
  - dependency-check
  - quality-analysis
  - build
  - test
  - security-audit
  - quality-gate
  - deploy

variables:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  DOCKER_DRIVER: overlay2
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"  # Tells git to fetch all commits for Sonar
  SECRET_DETECTION_EXCLUDED_PATHS: "node_modules, dist, coverage, .venv"

# Cache configuration for faster builds
.cache_template: &cache_config
  cache:
    key:
      files:
        - package-lock.json
        - backend/requirements.txt
    paths:
      - node_modules/
      - backend/.venv/
      - .pip-cache/
    policy: pull-push

# ============================================
# SECURITY SCANNING STAGE
# ============================================

# GitLab SAST (Static Application Security Testing) - CodeQL equivalent
sast:
  stage: security-scan
  include:
    - template: Security/SAST.gitlab-ci.yml
  variables:
    SAST_EXCLUDED_PATHS: "node_modules, dist, coverage, .venv"
    SAST_EXPERIMENTAL_FEATURES: "true"
  artifacts:
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
  allow_failure: true

# Secret Detection - Prevent credential leaks
secret_detection:
  stage: security-scan
  include:
    - template: Security/Secret-Detection.gitlab-ci.yml
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    expire_in: 1 week
  allow_failure: true

# Semgrep - Advanced static analysis (CodeQL-like)
semgrep-sast:
  stage: security-scan
  image: returntocorp/semgrep
  script:
    - semgrep --config=auto --json --output=semgrep-report.json .
    - semgrep --config=p/security-audit --json --output=semgrep-security.json .
    - semgrep --config=p/nodejs --json --output=semgrep-nodejs.json .
    - semgrep --config=p/typescript --json --output=semgrep-typescript.json .
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - semgrep-*.json
    expire_in: 1 week
  allow_failure: true

# ============================================
# DEPENDENCY SECURITY STAGE
# ============================================

# Dependency Scanning - Dependabot equivalent
dependency_scanning:
  stage: dependency-check
  include:
    - template: Security/Dependency-Scanning.gitlab-ci.yml
  variables:
    DS_EXCLUDED_PATHS: "node_modules, dist, coverage, .venv"
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    expire_in: 1 week
  allow_failure: true

# Snyk - Advanced vulnerability scanning
snyk-test:
  stage: dependency-check
  image: node:$NODE_VERSION
  before_script:
    - npm install -g snyk
    - npm ci
  script:
    - snyk auth $SNYK_TOKEN
    - snyk test --json > snyk-vulnerabilities.json || true
    - snyk monitor --project-name="electromagnetic-beat-lab"
  artifacts:
    paths:
      - snyk-vulnerabilities.json
    expire_in: 1 week
  variables:
    SNYK_TOKEN: $SNYK_TOKEN  # Set in GitLab CI/CD variables
  allow_failure: true

# Python backend dependency check
python-safety-check:
  stage: dependency-check
  image: python:$PYTHON_VERSION
  script:
    - cd backend
    - pip install safety bandit
    - pip install -r requirements.txt
    - safety check --json > safety-report.json || true
    - bandit -r . -f json -o bandit-report.json || true
  artifacts:
    paths:
      - backend/safety-report.json
      - backend/bandit-report.json
    expire_in: 1 week
  allow_failure: true

# ============================================
# QUALITY ANALYSIS STAGE
# ============================================

# SonarQube Analysis
sonarqube-check:
  stage: quality-analysis
  image:
    name: sonarqube/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  variables:
    SONAR_HOST_URL: $SONAR_HOST_URL  # Set in GitLab CI/CD variables
    SONAR_TOKEN: $SONAR_TOKEN        # Set in GitLab CI/CD variables
  only:
    - main
    - develop
    - merge_requests
  allow_failure: true

# ESLint Security Analysis
eslint-security:
  stage: quality-analysis
  image: node:$NODE_VERSION
  script:
    - npm ci
    - npm install -g @typescript-eslint/eslint-plugin eslint-plugin-security
    - npx eslint . --ext .ts,.tsx,.js,.jsx --format json > eslint-report.json || true
  artifacts:
    paths:
      - eslint-report.json
    expire_in: 1 week
  allow_failure: true

# ============================================
# BUILD STAGE
# ============================================

# Frontend Build
build:frontend:
  stage: build
  image: node:${NODE_VERSION}
  <<: *cache_config
  script:
    # Fix rollup dependency issue on Linux
    - rm -rf node_modules package-lock.json
    - npm install --no-audit
    # Type check and build
    - npm run build
    # Verify build artifacts
    - ls -la dist/
  artifacts:
    name: "frontend-build-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
      - node_modules/
    expire_in: 1 hour
    reports:
      dotenv: build.env
  rules:
    - changes:
        - "src/**/*"
        - "package*.json"
        - "tsconfig.json"
        - "vite.config.ts"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Backend Build
build:backend:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  <<: *cache_config
  before_script:
    # Install build dependencies for PyAudio
    - apt-get update && apt-get install -y gcc portaudio19-dev python3-dev
    # Setup Python environment
    - python -m venv backend/.venv
    - source backend/.venv/bin/activate
    - pip install --upgrade pip
    - pip install --cache-dir .pip-cache -r backend/requirements.txt
  script:
    # Validate Python code
    - source backend/.venv/bin/activate
    - cd backend
    - python -m py_compile main.py
    - python -c "import main; print('Backend validation successful')"
    # Create deployment package info
    - cd ..
    - echo "BACKEND_VERSION=$(python --version)" > build.env
    - echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build.env
    - echo "COMMIT_SHA=$CI_COMMIT_SHORT_SHA" >> build.env
  artifacts:
    name: "backend-build-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/
      - build.env
    expire_in: 1 hour
  rules:
    - changes:
        - "backend/**/*"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Docker Build
docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker build --security-opt no-new-privileges -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - gang-gang
    - develop

# ============================================
# TESTING STAGE
# ============================================

# Unit Tests with Coverage
test:frontend:unit:
  stage: test
  image: node:$NODE_VERSION
  script:
    - npm ci
    - npm run test:coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'

# Backend Tests
test:backend:
  stage: test
  image: python:$PYTHON_VERSION
  before_script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    expire_in: 1 week

# End-to-End Security Tests
e2e-security-tests:
  stage: test
  image: node:$NODE_VERSION
  services:
    - name: selenoid/vnc:chrome_78.0
      alias: chrome
  script:
    - npm ci
    - npm run build
    - npm run test:e2e:security || true
  artifacts:
    paths:
      - e2e-security-results/
    expire_in: 1 week
  allow_failure: true

# ============================================
# SECURITY AUDIT STAGE
# ============================================

# Container Security Scanning
container_scanning:
  stage: security-audit
  include:
    - template: Security/Container-Scanning.gitlab-ci.yml
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  dependencies:
    - docker-build
  allow_failure: true

# License Compliance Check
license_scanning:
  stage: security-audit
  include:
    - template: Security/License-Scanning.gitlab-ci.yml
  variables:
    LIC_EXCLUDED_PATHS: "node_modules, dist, coverage, .venv"
  artifacts:
    reports:
      license_scanning: gl-license-scanning-report.json
    expire_in: 1 week
  allow_failure: true

# OWASP ZAP Dynamic Security Testing
owasp-zap:
  stage: security-audit
  image: owasp/zap2docker-stable
  variables:
    website: "http://localhost:5173"
  script:
    - mkdir zap-reports
    - /zap/zap-baseline.py -t $website -J zap-baseline-report.json -w zap-baseline-report.md || true
    - /zap/zap-full-scan.py -t $website -J zap-full-report.json -w zap-full-report.md || true
  artifacts:
    paths:
      - zap-reports/
      - zap-*.json
      - zap-*.md
    expire_in: 1 week
  allow_failure: true

# ============================================
# QUALITY GATE STAGE
# ============================================

quality_gate:
  stage: quality-gate
  image: alpine:latest
  needs:
    - job: test:frontend:unit
      artifacts: true
    - job: test:backend
      artifacts: true
    - job: sast
      artifacts: false
      optional: true
    - job: secret_detection
      artifacts: false
      optional: true
  before_script:
    - apk add --no-cache jq curl bc
  script:
    # Check test coverage thresholds
    - |
      FRONTEND_COVERAGE=$(test -f coverage/lcov-report/index.html && grep -o 'Lines.*[0-9.]*%' coverage/lcov-report/index.html | grep -o '[0-9.]*' | head -1 || echo "0")
      BACKEND_COVERAGE=$(test -f backend/coverage.xml && grep -o 'TOTAL.*[0-9]*%' backend/coverage.xml | grep -o '[0-9]*' | tail -1 || echo "0")

      echo "Frontend Coverage: ${FRONTEND_COVERAGE}%"
      echo "Backend Coverage: ${BACKEND_COVERAGE}%"

      # Set minimum thresholds
      MIN_FRONTEND_COVERAGE=30
      MIN_BACKEND_COVERAGE=50

      # Check thresholds
      if (( $(echo "$FRONTEND_COVERAGE < $MIN_FRONTEND_COVERAGE" | bc -l) )); then
        echo "❌ Frontend coverage ${FRONTEND_COVERAGE}% below threshold ${MIN_FRONTEND_COVERAGE}%"
        exit 1
      fi

      if (( $(echo "$BACKEND_COVERAGE < $MIN_BACKEND_COVERAGE" | bc -l) )); then
        echo "❌ Backend coverage ${BACKEND_COVERAGE}% below threshold ${MIN_BACKEND_COVERAGE}%"
        exit 1
      fi

      echo "✅ All quality gates passed!"
      echo "✅ Frontend coverage: ${FRONTEND_COVERAGE}% (≥${MIN_FRONTEND_COVERAGE}%)"
      echo "✅ Backend coverage: ${BACKEND_COVERAGE}% (≥${MIN_BACKEND_COVERAGE}%)"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================
# SECURITY REPORTING & NOTIFICATIONS
# ============================================

# Aggregate Security Reports
security-report:
  stage: security-audit
  image: alpine:latest
  before_script:
    - apk add --no-cache jq curl
  script:
    - echo "# Electromagnetic Beat Lab Security Report" > security-summary.md
    - echo "Generated on $(date)" >> security-summary.md
    - echo "" >> security-summary.md

    # Aggregate SAST findings
    - echo "## Static Analysis Security Testing (SAST)" >> security-summary.md
    - jq -r '.vulnerabilities[] | "- **\(.severity)**: \(.message) in \(.location.file):\(.location.start_line)"' gl-sast-report.json >> security-summary.md || echo "No SAST report found" >> security-summary.md

    # Aggregate dependency vulnerabilities
    - echo "" >> security-summary.md
    - echo "## Dependency Vulnerabilities" >> security-summary.md
    - jq -r '.vulnerabilities[] | "- **\(.severity)**: \(.title) in \(.location.dependency.package.name)"' gl-dependency-scanning-report.json >> security-summary.md || echo "No dependency vulnerabilities found" >> security-summary.md

    # Secret detection results
    - echo "" >> security-summary.md
    - echo "## Secret Detection" >> security-summary.md
    - jq -r '.vulnerabilities[] | "- **SECRET DETECTED**: \(.description) in \(.location.file)"' gl-secret-detection-report.json >> security-summary.md || echo "No secrets detected" >> security-summary.md

    # Send to monitoring webhook if configured
    - |
      if [ -n "$SECURITY_WEBHOOK_URL" ]; then
        curl -X POST -H "Content-Type: application/json" \
             -d "{\"text\": \"Security scan completed for Electromagnetic Beat Lab\", \"attachments\": [{\"text\": \"$(cat security-summary.md)\"}]}" \
             $SECURITY_WEBHOOK_URL
      fi
  artifacts:
    paths:
      - security-summary.md
    expire_in: 1 week
  dependencies:
    - sast
    - dependency_scanning
    - secret_detection
  allow_failure: true

# ============================================
# DEPLOYMENT STAGE (Conditional)
# ============================================

deploy-staging:
  stage: deploy
  script:
    - echo "Deploying to staging with security validation..."
    # Add your deployment scripts here
  environment:
    name: staging
    url: https://staging.electromagnetic-beat-lab.com
  only:
    - develop
  when: manual
  dependencies:
    - build:frontend
    - docker-build
    - build:backend

deploy-production:
  stage: deploy
  script:
    - echo "Deploying to production with security validation..."
    # Add your production deployment scripts here
  environment:
    name: production
    url: https://electromagnetic-beat-lab.com
  only:
    - main
  when: manual
  dependencies:
    - build:frontend
    - docker-build
    - build:backend