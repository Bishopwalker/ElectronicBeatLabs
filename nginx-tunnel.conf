events {
    worker_connections 1024;
}

http {
    server {
        listen 3000;
        
        # Frontend - serve everything by default
        location / {
            proxy_pass http://host.docker.internal:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Backend API endpoints
        location /api/ {
            proxy_pass http://host.docker.internal:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        # WebSocket for audio streaming
        location /ws {
            proxy_pass http://host.docker.internal:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }
        
        # Backend health check
        location /health {
            proxy_pass http://host.docker.internal:8000/health;
        }
        
        # Backend API docs
        location /docs {
            proxy_pass http://host.docker.internal:8000/docs;
        }
        
        location /openapi.json {
            proxy_pass http://host.docker.internal:8000/openapi.json;
        }
    }
}
