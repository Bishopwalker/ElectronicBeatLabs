version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ebl-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebl_dev
      POSTGRES_USER: ebl_dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ebl-dev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ebl-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ebl-dev-network

  # Development Application (Hot-reload enabled)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ebl-app-dev
    restart: unless-stopped
    ports:
      - "5173:5173"  # Frontend Vite
      - "8000:8000"  # Backend FastAPI
    environment:
      # Database
      DATABASE_URL: postgresql://ebl_dev_user:dev_password@postgres:5432/ebl_dev

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Development
      NODE_ENV: development
      PYTHON_ENV: development
      DEBUG: "true"

      # Security (dev keys)
      SECRET_KEY: dev-secret-key-not-for-production
      JWT_SECRET: dev-jwt-secret-not-for-production

      # CORS (allow all in dev)
      ALLOWED_ORIGINS: "*"
    volumes:
      # Mount source for hot-reload
      - ./src:/app/src
      - ./backend:/app/backend
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json

      # Persist data
      - ./logs:/app/logs
      - ./data:/app/data

      # Exclude node_modules
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - ebl-dev-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  ebl-dev-network:
    driver: bridge