
services:
  # Backend only for development (frontend runs via npm)
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: builder  # Use builder stage for dev
    container_name: ebl-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Development settings
      PYTHON_ENV: development
      DEBUG: "true"
      
      # Database - using SQLite for dev simplicity
      DATABASE_URL: sqlite:///./ebl_database.db
      
      # CORS - allow frontend dev server
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      
      # Audio settings
      SAMPLE_RATE: 48000
      BUFFER_SIZE: 800
      MAX_FREQUENCY: 199
      AUDIO_FRAME_RATE: 60
      
      # WebSocket
      WS_HEARTBEAT_INTERVAL: 30
      WS_CONNECTION_TIMEOUT: 60
      
      # Security (dev keys)
      SECRET_KEY: dev-secret-key-not-for-production
      JWT_SECRET: dev-jwt-secret-not-for-production
      
      # Hot reload
      RELOAD: "true"
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
      - ./data:/app/data
      - ./ebl_database.db:/app/ebl_database.db
    command: >
      sh -c "
        cd /app &&
        python -m uvicorn backend.main:app 
        --host 0.0.0.0 
        --port 8000 
        --reload 
        --reload-dir backend
        --ws-ping-interval 20
        --ws-ping-timeout 20
      "
    networks:
      - ebl-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PostgreSQL for development
  postgres-dev:
    image: postgres:15-alpine
    container_name: ebl-postgres-dev
    environment:
      POSTGRES_DB: ebl_dev
      POSTGRES_USER: ebl_dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - ebl-dev-network
    profiles:
      - with-postgres  # Only starts with --profile with-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebl_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for development
  redis-dev:
    image: redis:7-alpine
    container_name: ebl-redis-dev
    command: redis-server
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    networks:
      - ebl-dev-network
    profiles:
      - with-redis  # Only starts with --profile with-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:

networks:
  ebl-dev-network:
    driver: bridge