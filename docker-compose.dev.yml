
services:
  # Backend Development (FastAPI with hot-reload)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: builder  # Use builder stage with dev dependencies
    container_name: ebl-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Development settings
      PYTHON_ENV: development
      DEBUG: "true"
      PYTHONPATH: /app/backend
      
      # Database - using SQLite for dev
      DATABASE_URL: sqlite:///./ebl_database.db
      
      # CORS - allow frontend dev server
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      
      # Audio settings
      SAMPLE_RATE: 48000
      BUFFER_SIZE: 800
      MAX_FREQUENCY: 1999
      AUDIO_FRAME_RATE: 60
      
      # WebSocket
      WS_HEARTBEAT_INTERVAL: 30
      WS_CONNECTION_TIMEOUT: 60
      
      # Security (dev keys)
      SECRET_KEY: dev-secret-key-not-for-production
      JWT_SECRET: dev-jwt-secret-not-for-production
    volumes:
      # Mount backend source for hot-reload
      - ./backend:/app/backend
      - ./logs:/app/logs
      - ./data:/app/data
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend --ws-ping-interval 20 --ws-ping-timeout 20
    networks:
      - ebl-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Development (Vite with hot-reload)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev.vite
    container_name: ebl-frontend-dev.vite
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080/ws
    volumes:
      # Mount frontend source for hot-reload
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - ./package.json:/app/package.json
      # Use named volume for node_modules
      - node_modules_volume:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - ebl-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  node_modules_volume:
    driver: local

networks:
  ebl-dev-network:
    driver: bridge